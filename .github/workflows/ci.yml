name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Ruff
        run: ruff check .

      - name: Import validation
        run: python -c "import enterprise_intelligence_platform; import enterprise_intelligence_platform.hooks"

      - name: Unit tests
        run: pytest -q enterprise_intelligence_platform/tests
